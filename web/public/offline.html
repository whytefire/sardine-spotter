<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0e4271" />
    <title>Offline — Sardine Spotter</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        font-family:
          "Plus Jakarta Sans", "Inter", -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(180deg, #0e4271 0%, #21aca9 100%);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
      }
      .card {
        max-width: 32rem;
        width: 100%;
        padding: 2.5rem 2rem;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 1.5rem;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }
      img {
        width: 96px;
        height: 96px;
        margin: 0 auto 1.5rem;
        border-radius: 1.25rem;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
      }
      h1 {
        font-size: 1.75rem;
        font-weight: 800;
        margin: 0 0 0.5rem;
        letter-spacing: -0.02em;
      }
      p {
        font-size: 1rem;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.85);
        margin: 0 0 1.5rem;
      }
      button {
        font: inherit;
        cursor: pointer;
        padding: 0.875rem 1.75rem;
        font-weight: 600;
        font-size: 0.9375rem;
        border-radius: 0.875rem;
        background: #fff;
        color: #0e4271;
        border: 0;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        transition: transform 120ms ease;
        min-height: 44px;
      }
      button:hover {
        transform: translateY(-1px);
      }
      button:active {
        transform: translateY(0);
      }
      .tag {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.7);
        background: rgba(255, 255, 255, 0.08);
        padding: 0.25rem 0.75rem;
        border-radius: 999px;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192-maskable.png" alt="Sardine Spotter" />
      <span class="tag">You're offline</span>
      <h1>The shoal got away</h1>
      <p>
        We can't reach Sardine Spotter right now — looks like your connection
        dropped. Anything you've already loaded will keep working, and we'll
        sync up as soon as you're back online.
      </p>
      <button onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
